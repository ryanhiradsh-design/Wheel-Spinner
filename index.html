<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Wheel Spinner</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f7f7fb;color:#202124}header{padding:22px 18px 8px;font-size:28px;font-weight:800}.wrap{padding:12px 16px 30px;max-width:700px;margin:auto}.card{background:white;border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #00000012}input,button{font:inherit}input{padding:12px;border:1px solid #ddd;border-radius:12px;width:100%}.row{display:flex;gap:8px;margin:8px 0}.row button{width:44px}.btn{border:0;border-radius:13px;padding:12px 16px;background:#6750a4;color:white;font-weight:700}.secondary{background:#eee;color:#222}.wheelwrap{display:flex;flex-direction:column;align-items:center}.pointer{width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:28px solid #222;z-index:2;margin-bottom:-4px}.wheel{width:min(330px,82vw);height:min(330px,82vw);border-radius:50%;border:6px solid #222;overflow:hidden;position:relative;transition:transform 4s cubic-bezier(.12,.72,.12,1);background:conic-gradient(#f99 0 25%,#9df 25% 50%,#9f9 50% 75%,#fd9 75% 100%)}.center{position:absolute;width:46px;height:46px;background:white;border:4px solid #222;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3}.saved button{width:100%;text-align:left;margin:5px 0}.result{font-size:20px;font-weight:800;text-align:center;min-height:30px}</style></head><body><header>🎡 Wheel Spinner</header><div class="wrap"><div class="card"><div class="row"><input id="name" value="My Wheel"><button class="btn" id="save">Save</button></div><div id="entries"></div><div class="row"><button class="btn secondary" id="add">+ Option</button><button class="btn secondary" id="clear">Clear</button></div></div><div class="card wheelwrap"><div class="pointer"></div><div id="wheel" class="wheel"><div class="center"></div></div><button class="btn" id="spin" style="margin-top:18px;width:80%;font-size:18px">SPIN</button><div class="result" id="result">Add options and spin!</div></div><div class="card"><b>Saved wheels</b><div id="saved" class="saved"></div></div></div><script>(()=>{let o=['Option 1','Option 2','Option 3','Option 4'],rot=0,busy=false;const $=id=>document.getElementById(id),storeKey='wheelSpinnerSaved';function saved(){try{return JSON.parse(localStorage.getItem(storeKey)||'[]')}catch(e){return[]}}function store(x){localStorage.setItem(storeKey,JSON.stringify(x))}function render(){entries.innerHTML='';o.forEach((v,i)=>{let r=document.createElement('div');r.className='row';let x=document.createElement('input');x.value=v;x.oninput=()=>{o[i]=x.value};let b=document.createElement('button');b.textContent='×';b.className='btn secondary';b.onclick=()=>{o.splice(i,1);render()};r.append(x,b);entries.append(r)});savedRender()}function savedRender(){savedEl.innerHTML='';saved().forEach((w,i)=>{let b=document.createElement('button');b.className='btn secondary';b.textContent=w.name;b.onclick=()=>{name.value=w.name;o=[...w.options];render();result.textContent='Loaded '+w.name};let d=document.createElement('button');d.className='btn secondary';d.textContent='Delete';d.onclick=()=>{let a=saved();a.splice(i,1);store(a);savedRender()};let r=document.createElement('div');r.className='row';r.append(b,d);savedEl.append(r)})}function valid(){return o.map(x=>x.trim()).filter(Boolean)}add.onclick=()=>{o.push('New option');render()};clear.onclick=()=>{o=[];render();result.textContent=''};save.onclick=()=>{let n=name.value.trim()||'Untitled Wheel',a=saved(),item={name:n,options:valid()},i=a.findIndex(x=>x.name===n);if(i>=0)a[i]=item;else a.push(item);store(a);savedRender();result.textContent='Saved '+n};spin.onclick=()=>{if(busy)return;let v=valid();if(!v.length){result.textContent='Add at least one option.';return}busy=true;let i=Math.floor(Math.random()*v.length),step=360/v.length;rot+=1440+(360-i*step-step/2);wheel.style.transform='rotate('+rot+'deg)';setTimeout(()=>{result.textContent='🎉 '+v[i];busy=false},4100)};const entries=$('entries'),savedEl=$('saved'),wheel=$('wheel'),name=$('name'),add=$('add'),clear=$('clear'),save=$('save'),spin=$('spin'),result=$('result');render()})();</script></body></html>
